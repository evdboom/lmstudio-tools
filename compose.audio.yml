services:
  kokoro-cpu:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:${KOKORO_TAG:-latest}
    profiles: [cpu]
    ports:
      - "127.0.0.1:8880:8880"
    restart: unless-stopped
  kokoro-cuda:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:${KOKORO_TAG:-latest}
    profiles: [cuda]
    ports:
      - "127.0.0.1:8880:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped